<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moss - 智能文档助手</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="stylesheet" href="/static/css/app-loading.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
        "@tiptap/core": "https://esm.sh/@tiptap/core@2.2.4",
        "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@2.2.4",
        "marked": "https://esm.sh/marked@12.0.2",
        "dompurify": "https://esm.sh/dompurify@3.0.8"
      }
    }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #171717; }
        [v-cloak] { display: none !important; }

        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .document-content { color: #404040; line-height: 1.8; font-weight: 400; font-size: 0.95rem; }
        .document-content h1 { font-size: 1.8rem; font-weight: 600; color: #171717; margin-bottom: 0.5rem; margin-top: 1.5rem; letter-spacing: 0; }
        .document-content h2 { font-size: 1.5rem; font-weight: 600; color: #171717; margin-top: 1.5rem; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e5e5e5; }
        .document-content h3 { font-size: 1.25rem; font-weight: 600; color: #262626; margin-top: 1.25rem; margin-bottom: 0.5rem; }
        .document-content h4 { font-size: 1.1rem; font-weight: 600; color: #404040; margin-top: 1rem; margin-bottom: 0.5rem; }
        .document-content h5 { font-size: 1rem; font-weight: 600; color: #525252; margin-top: 1rem; margin-bottom: 0.5rem; }
        .document-content h6 { font-size: 0.95rem; font-weight: 600; color: #737373; margin-top: 1rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0; }
        .document-content p { margin-bottom: 0.75rem; }
        .document-content ul { list-style-type: none; padding-left: 0; margin-bottom: 1.5rem; }
        .document-content li { position: relative; padding-left: 1rem; margin-bottom: 0.5rem; }
        .document-content li::before { content: '•'; position: absolute; left: 0; color: #a3a3a3; font-weight: bold; }
        .document-content strong { color: #171717; font-weight: 600; }
        .document-content code { background-color: #f5f5f5; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.85em; font-family: monospace; }
        .ProseMirror:focus { outline: none; }

        .chat-markdown { white-space: normal; overflow-x: auto; }
        .chat-markdown :where(p) { margin: 0 0 0.75rem; }
        .chat-markdown :where(p:last-child) { margin-bottom: 0; }
        .chat-markdown :where(strong) { color: #171717; font-weight: 600; }
        .chat-markdown :where(a) { color: #262626; text-decoration: underline; text-underline-offset: 2px; }
        .chat-markdown :where(ul, ol) { margin: 0.5rem 0 0.75rem; padding-left: 1.25rem; }
        .chat-markdown :where(ul) { list-style: disc; }
        .chat-markdown :where(ol) { list-style: decimal; }
        .chat-markdown :where(li) { margin: 0.25rem 0; }
        .chat-markdown :where(h1, h2, h3, h4) { color: #171717; font-weight: 600; line-height: 1.35; margin: 0.85rem 0 0.45rem; letter-spacing: 0; }
        .chat-markdown :where(h1) { font-size: 1.15rem; }
        .chat-markdown :where(h2) { font-size: 1.05rem; }
        .chat-markdown :where(h3, h4) { font-size: 1rem; }
        .chat-markdown :where(code) { background: #f5f5f5; border-radius: 0.25rem; color: #262626; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 0.86em; padding: 0.15rem 0.3rem; }
        .chat-markdown :where(pre) { background: #f7f7f7; border: 1px solid #e5e5e5; border-radius: 0.5rem; margin: 0.75rem 0; overflow-x: auto; padding: 0.85rem; }
        .chat-markdown :where(pre code) { background: transparent; border-radius: 0; display: block; padding: 0; white-space: pre; }
        .chat-markdown :where(blockquote) { border-left: 3px solid #d4d4d4; color: #525252; margin: 0.75rem 0; padding-left: 0.75rem; }
        .chat-markdown :where(table) { border-collapse: collapse; margin: 0.75rem 0; min-width: 24rem; width: 100%; }
        .chat-markdown :where(th, td) { border: 1px solid #e5e5e5; padding: 0.45rem 0.6rem; text-align: left; vertical-align: top; }
        .chat-markdown :where(th) { background: #f7f7f7; color: #262626; font-weight: 600; }
        .chat-markdown :where(hr) { border: 0; border-top: 1px solid #e5e5e5; margin: 0.9rem 0; }

        .cursor-blink::after { content: '|'; animation: blink 1s step-start infinite; color: #171717; font-weight: 300; }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(-4px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-pop-in { animation: popIn 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .resizing { user-select: none; -webkit-user-select: none; cursor: ns-resize !important; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden selection:bg-black selection:text-white">

<div id="app-loading" class="app-loading" role="status" aria-live="polite">
    <div class="app-loading-stage">
        <div class="app-loading-mark" aria-hidden="true">*</div>
        <div class="app-loading-text">loading...</div>
    </div>
</div>

<div id="app" v-cloak class="relative h-full w-full flex flex-col bg-[#fafafa]" :class="{'resizing': isDragging}">

    <div v-if="showAIPopup"
         class="fixed z-[200] bg-white rounded-lg shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-gray-200 p-2 flex items-center gap-3 w-[min(20rem,calc(100vw-2rem))] transform transition-all duration-200 ease-out"
         :style="{ top: aiPopupPos.top + 'px', left: aiPopupPos.left + 'px' }">
        <div class="w-7 h-7 rounded-full bg-gray-50 flex items-center justify-center shrink-0 border border-gray-200">
            <i class="fa-solid fa-asterisk text-gray-500 text-[10px]"></i>
        </div>
        <input ref="aiPopupInputRef"
               v-model="aiPopupInput"
               @keyup.enter="submitAIPopup"
               @keydown.esc="closeAIPopup"
               @blur="closeAIPopup"
               type="text"
               placeholder="给 moss 发送指令"
               class="flex-1 bg-transparent border-none outline-none text-[14px] text-gray-800 placeholder-gray-400 min-w-0">
    </div>

    <button v-if="!isFullScreen"
            ref="libraryButtonRef"
            @click="openLibrary"
            class="fixed top-[2.125rem] left-6 xl:left-[calc(50%_-_28rem_-_3.25rem)] z-[70] w-10 h-10 rounded-full bg-white border border-gray-200 shadow-lg text-gray-800 hover:bg-gray-50 transition-colors flex items-center justify-center"
            title="Back to Library">
        <i class="fa-solid fa-chevron-left text-xs"></i>
    </button>

    <div ref="panelRef"
         class="fixed left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 flex flex-col overflow-visible origin-top"
         :class="[
            isFullScreen ? 'rounded-none z-[100]' : 'rounded-2xl z-40',
            isDragging ? 'transition-none' : 'transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)]'
         ]"
         style="will-change: width, height, top, max-width;"
         :style="{
            height: isFullScreen ? '100vh' : panelHeight + 'px',
            width: isFullScreen ? '100vw' : '95%',
            maxWidth: isFullScreen ? '100vw' : '56rem',
            top: isFullScreen ? '0px' : '1.5rem'
         }">

        <div class="bg-white/50 px-4 md:px-6 py-4 flex justify-between items-center shrink-0 border-b border-gray-100 transition-all duration-300"
             :class="isFullScreen ? 'rounded-none' : 'rounded-t-2xl'">
            <div class="flex items-center gap-3 text-gray-500 min-w-0">
                <button v-if="isFullScreen"
                        @click="openLibrary"
                        class="p-2 -ml-2 rounded-lg text-gray-500 hover:bg-white/70 hover:text-gray-800 transition-colors flex items-center justify-center shrink-0"
                        title="Back to Library">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <i class="fa-regular fa-file-lines text-gray-400"></i>
                <div ref="conversationTreeRef" class="relative flex items-center gap-2 min-w-0" @click.stop>
                    <span class="font-medium text-xs tracking-wider uppercase text-gray-500 truncate">{{ documentTitle }}</span>
                    <button v-if="currentNoteId"
                            @click="toggleConversationTree"
                            class="h-7 rounded-md px-2 text-[11px] text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors flex items-center gap-1 shrink-0"
                            :title="showConversationTree ? 'Close discussions' : 'Open discussions'">
                        <span>{{ noteConversations.length || 1 }}</span>
                        <i :class="showConversationTree ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down'" class="text-[9px]"></i>
                    </button>
                </div>
            </div>
            <div class="flex gap-2 md:gap-3 items-center">
                <span v-if="isModifying" class="hidden sm:flex text-xs text-gray-500 items-center gap-2 pr-2">
                    <i class="fa-solid fa-pen-nib animate-bounce text-xs"></i> AI Processing
                </span>
                <input ref="fileInputRef" type="file" accept=".txt,.md,.markdown,.docx,.pdf" class="hidden" @change="handleUpload">
                <button @click="triggerUpload"
                        class="text-xs bg-white border border-gray-200 text-gray-700 px-3 md:px-4 py-2.5 rounded-lg hover:bg-gray-50 transition-colors shadow-sm font-medium flex items-center gap-2"
                        title="导入文档">
                    <i class="fa-solid fa-upload text-[11px]"></i>
                    <span class="hidden sm:inline">Upload</span>
                </button>
                <button @click="exportDocument('markdown')"
                        class="text-xs bg-white border border-gray-200 text-gray-700 px-3 md:px-4 py-2.5 rounded-lg hover:bg-gray-50 transition-colors shadow-sm font-medium flex items-center gap-2"
                        title="导出 Markdown">
                    <i class="fa-solid fa-download text-[11px]"></i>
                    <span class="hidden sm:inline">Export</span>
                </button>
            </div>
        </div>

        <div class="relative flex-1 overflow-hidden">
            <div class="p-6 md:p-14 overflow-y-auto h-full document-content scroll-smooth no-scrollbar" id="document-container">
                <div class="max-w-3xl mx-auto w-full">
                    <div ref="editorContainer" :class="{'cursor-blink': isModifying}"></div>
                </div>
            </div>

            <div v-if="isModifying" class="absolute inset-0 bg-white/40 backdrop-blur-[1px] flex items-center justify-center z-10 transition-all duration-300">
                <div class="bg-white border border-gray-200 shadow-lg px-5 py-2.5 rounded-full text-gray-700 flex items-center gap-2 text-sm font-medium">
                    <i class="fa-solid fa-circle-notch fa-spin text-gray-400"></i> AI is thinking
                </div>
            </div>
        </div>

        <div class="absolute bottom-6 right-6 z-50 flex items-center gap-3 transition-all duration-300">
            <button @click="saveContent"
                    class="w-10 h-10 rounded-full bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 transition flex items-center justify-center shadow-lg transform hover:scale-105 active:scale-95"
                    title="保存文本 (Ctrl+S)">
                <i v-if="isSaving" class="fa-solid fa-check text-green-500 text-sm transition-all duration-300"></i>
                <i v-else class="fa-regular fa-floppy-disk text-sm transition-all duration-300"></i>
            </button>

            <button @click="toggleFullScreen"
                    class="w-10 h-10 rounded-full bg-black hover:bg-gray-800 text-white transition flex items-center justify-center shadow-lg transform hover:scale-105 active:scale-95"
                    title="全屏切换 (Ctrl+Shift+F)">
                <i :class="isFullScreen ? 'fa-solid fa-down-left-and-up-right-to-center' : 'fa-solid fa-up-right-and-down-left-from-center'" class="text-xs transition-all duration-300"></i>
            </button>
        </div>

        <div v-if="!isFullScreen"
             class="absolute -bottom-2 left-0 w-full h-4 cursor-ns-resize z-[60]"
             @mousedown="startDragging"></div>
    </div>

    <div v-if="showConversationTree && currentNoteId"
         ref="conversationTreePanelRef"
         class="fixed bg-white/80 backdrop-blur-xl border border-gray-100 rounded-xl text-gray-800 flex flex-col gap-1 overflow-hidden animate-pop-in"
         style="box-shadow: 0 8px 30px rgb(0 0 0 / 0.08); padding: 0.375rem;"
         :style="conversationTreeStyle"
         @click.stop>
        <div class="flex items-center justify-between gap-3 px-2 py-1.5 border-b border-gray-100 mb-1">
            <div class="min-w-0 font-semibold text-gray-800 text-xs truncate">{{ documentTitle }}</div>
            <button @click.stop="createConversation"
                    :disabled="isCreatingConversation || isModifying"
                    class="h-6 w-6 rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-800 transition-colors flex items-center justify-center shrink-0 disabled:opacity-60 disabled:cursor-not-allowed"
                    title="新建讨论">
                <i :class="isCreatingConversation ? 'fa-solid fa-circle-notch fa-spin' : 'fa-solid fa-plus'" class="text-[10px]"></i>
            </button>
        </div>

        <div class="mt-1 flex flex-col gap-1" style="line-height: 1.5;">
            <button v-for="(conversation, index) in noteConversations"
                    :key="conversation.conversation_id"
                    @click="switchConversation(conversation)"
                    :disabled="isModifying"
                    class="group w-full flex items-center justify-between px-2 py-1.5 text-sm transition-all rounded-lg disabled:opacity-60 disabled:cursor-not-allowed text-left"
                    :class="isCurrentConversation(conversation) ? 'bg-gray-100 text-gray-900 font-medium' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-800'"
                    :title="conversationTitle(conversation)">
                <div class="flex items-center gap-2 overflow-hidden min-w-0">
                    <i class="fa-regular fa-message text-[11px] shrink-0"
                       :class="isCurrentConversation(conversation) ? 'text-gray-700' : 'text-gray-400'"></i>
                    <span class="truncate">{{ conversationTitle(conversation) }}</span>
                </div>
                <span v-if="isCurrentConversation(conversation)"
                      class="rounded-full bg-black shrink-0"
                      style="width: 0.375rem; height: 0.375rem;"></span>
            </button>
            <div v-if="!noteConversations.length && !isLoadingConversations"
                 class="px-2 py-2 text-xs text-gray-400 text-center">
                暂无讨论
            </div>
        </div>

        <div v-if="isLoadingConversations" class="mt-1 px-2 py-1 text-xs text-gray-400">loading...</div>
        <div v-if="conversationError" class="mt-1 px-2 py-1 text-xs text-red-500 truncate">{{ conversationError }}</div>
    </div>

    <div class="relative w-full max-w-4xl mx-auto h-screen overflow-y-auto pb-48 px-4 md:px-0 scroll-smooth no-scrollbar origin-top"
         id="chat-container"
         :class="[
            isFullScreen ? 'opacity-0 pointer-events-none z-0 scale-95 blur-sm' : 'opacity-100 z-10 scale-100 blur-0',
            isDragging ? 'transition-none' : 'transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)]'
         ]"
         style="will-change: transform, opacity, filter;"
         :style="{ paddingTop: (chatPaddingTop + panelHeight) + 'px' }">

        <div class="flex flex-col gap-6 w-full">
            <div v-for="(msg, index) in messages" :key="index" class="w-full group">
                <template v-if="isAnswerMessage(msg)">
                    <div class="max-w-3xl mx-auto flex gap-4">
                        <div class="w-8 h-8 rounded-full border border-gray-200 bg-white flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-asterisk text-gray-600 text-xs"></i>
                        </div>
                        <div class="min-w-0 flex-1 flex flex-col">
                            <div class="chat-markdown text-[15px] leading-relaxed text-gray-800" v-html="renderMarkdown(msg.content)"></div>
                            <div class="mt-2 flex items-center gap-2 self-end">
                                <span v-if="msg.taskType"
                                      class="text-[11px] text-gray-400 border border-gray-200 rounded-full px-2 py-0.5 leading-snug opacity-0 group-hover:opacity-100 group-focus-within:opacity-100 transition-opacity">
                                    {{ getTaskTypeLabel(msg.taskType) }}
                                </span>
                                <button @click.stop="copyMessage(msg.content, index)"
                                        class="h-8 w-8 rounded-md text-gray-400 opacity-0 group-hover:opacity-100 focus:opacity-100 hover:text-gray-700 hover:bg-white/70 transition-all flex items-center justify-center text-sm"
                                        title="Copy message">
                                    <i :class="copiedMessageIndex === index ? 'fa-solid fa-check text-green-500' : 'fa-regular fa-copy'"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>

                <template v-else>
                    <div class="flex gap-4 max-w-[85%]"
                         :class="msg.role === 'user' ? 'ml-auto flex-row-reverse' : ''">

                        <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 border border-gray-200 bg-white"
                             :class="msg.role === 'user' ? 'bg-black border-black' : ''">
                            <span v-if="msg.role === 'user'" class="text-white text-sm font-medium">@</span>
                            <i v-else class="fa-solid fa-asterisk text-gray-600 text-xs"></i>
                        </div>

                        <div v-if="msg.role === 'user'" class="flex flex-row-reverse items-center gap-2">
                            <div class="p-4 rounded-2xl text-[15px] leading-relaxed bg-black text-white rounded-tr-sm shadow-sm whitespace-pre-wrap">
                                {{ msg.content }}
                            </div>
                            <button @click.stop="copyMessage(msg.content, index)"
                                    class="h-8 w-8 rounded-md text-gray-400 opacity-0 group-hover:opacity-100 focus:opacity-100 hover:text-gray-700 hover:bg-white/70 transition-all flex items-center justify-center text-sm"
                                    title="Copy message">
                                <i :class="copiedMessageIndex === index ? 'fa-solid fa-check text-green-500' : 'fa-regular fa-copy'"></i>
                            </button>
                        </div>

                        <div v-else class="flex flex-col items-start">
                            <div class="p-4 rounded-2xl text-[15px] leading-relaxed bg-white border border-gray-100 text-gray-800 rounded-tl-sm shadow-sm">
                                <div class="chat-markdown" v-html="renderMarkdown(msg.content)"></div>
                            </div>
                            <button @click.stop="copyMessage(msg.content, index)"
                                    class="mt-1 h-8 w-8 rounded-md text-gray-400 opacity-0 group-hover:opacity-100 focus:opacity-100 hover:text-gray-700 hover:bg-white/70 transition-all flex items-center justify-center text-sm self-end"
                                    title="Copy message">
                                <i :class="copiedMessageIndex === index ? 'fa-solid fa-check text-green-500' : 'fa-regular fa-copy'"></i>
                            </button>
                        </div>
                    </div>
                </template>
            </div>

            <div v-if="isThinking" class="flex gap-4 max-w-[85%]">
                <div class="w-8 h-8 rounded-full border border-gray-200 bg-white flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-asterisk text-gray-300 text-xs"></i>
                </div>
                <div class="p-4 rounded-2xl rounded-tl-sm bg-white border border-gray-100 flex items-center h-[52px] shadow-sm">
                    <i class="fa-solid fa-ellipsis text-gray-400 animate-pulse"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed left-1/2 w-[95%] max-w-3xl z-50 transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)]"
         style="bottom: 1.5rem; will-change: transform, opacity;"
         :class="isFullScreen ? 'translate-y-[150px] -translate-x-1/2 opacity-0 pointer-events-none' : 'translate-y-0 -translate-x-1/2 opacity-100'">
        <div class="bg-white rounded-full shadow-[0_4px_20px_rgb(0,0,0,0.05)] border border-gray-200 p-2 pl-5 flex items-center gap-3 transition-all focus-within:border-gray-300">
            <input v-model="inputText"
                   @keyup.enter="sendMessage()"
                   type="text"
                   placeholder="与 moss 对话，输入指令以处理文本..."
                   class="flex-1 bg-transparent border-none outline-none text-[15px] text-gray-800 placeholder-gray-400 py-3 font-light min-w-0"
                   :disabled="isModifying">
            <button @click="sendMessage()"
                    :disabled="!inputText.trim() || isModifying"
                    class="w-10 h-10 rounded-full bg-black hover:bg-gray-800 disabled:bg-gray-100 disabled:text-gray-400 text-white transition-all flex items-center justify-center shrink-0 disabled:cursor-not-allowed transform hover:scale-105 active:scale-95"
                    title="发送">
                <i class="fa-solid fa-arrow-up text-sm"></i>
            </button>
        </div>
    </div>

</div>

<script type="module">
    import { createApp, ref, nextTick, onMounted, onUnmounted } from 'vue';
    import { Editor, Node, mergeAttributes, Extension } from '@tiptap/core';
    import StarterKit from '@tiptap/starter-kit';
    import { marked } from 'marked';
    import DOMPurify from 'dompurify';

    marked.setOptions({
        breaks: true,
        gfm: true
    });

    const loadingStartedAt = performance.now();
    const minimumLoadingMs = 320;

    const hideInitialLoading = () => {
        const loading = document.getElementById('app-loading');
        if (!loading) return;
        if (loading.dataset.closing === 'true') return;
        loading.dataset.closing = 'true';
        const elapsed = performance.now() - loadingStartedAt;
        const delay = Math.max(0, minimumLoadingMs - elapsed);
        window.setTimeout(() => {
            loading.classList.add('app-loading-hidden');
            loading.setAttribute('aria-hidden', 'true');
            window.setTimeout(() => loading.remove(), 260);
        }, delay);
    };

    const DEFAULT_API_BASE = 'http://127.0.0.1:8000';
    const API_BASE = window.MOSS_API_BASE || (window.location.protocol.startsWith('http') ? window.location.origin : DEFAULT_API_BASE);
    const apiUrl = (path) => `${API_BASE.replace(/\/$/, '')}${path}`;
    const makeId = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const MOSS_BLOCK_ID_PREFIX = 'moss-block-';
    const MOSS_TEMP_ANCHOR_PREFIX = 'moss-temp-anchor-';
    const TEMP_ANCHOR_ATTR = 'dataMossTempAnchor';

    const CustomDiv = Node.create({
        name: 'customDiv',
        group: 'block',
        content: 'block*',
        parseHTML() { return [{ tag: 'div' }] },
        renderHTML({ HTMLAttributes }) { return ['div', mergeAttributes(HTMLAttributes), 0] }
    });

    const GlobalAttributes = Extension.create({
        name: 'globalAttributes',
        addGlobalAttributes() {
            return [
                {
                    types: ['heading', 'paragraph', 'customDiv', 'bulletList', 'orderedList', 'listItem', 'blockquote'],
                    attributes: {
                        class: { default: null, parseHTML: el => el.getAttribute('class'), renderHTML: attrs => attrs.class ? { class: attrs.class } : {} },

    createApp({

                        textarea.style.top = '-9999px';
                        textarea.style.opacity = '0';
                        document.body.appendChild(textarea);

            const initialContent = `
                <h1>欢迎使用 moss</h1>
                <p class="text-sm text-gray-500 mb-8">智能文本与文档协作助手</p>

                <h2>功能特性</h2>
                <ul>

                    <li><strong>层级升降：</strong> 按 <code>Ctrl + +</code> 提升当前标题，按 <code>Ctrl + -</code> 降低当前标题。</li>
                    <li><strong>AI 悬浮窗：</strong> 使用 <code>Ctrl + /</code> 唤起光标处悬浮指令窗。</li>
                    <li><strong>快捷操作：</strong> <code>Ctrl + S</code> 保存，<code>Ctrl + Shift + F</code> 全屏切换。</li>
                </ul>

                <div id="demo-section" class="transition-colors duration-500 rounded-lg p-2 -mx-2 mt-4">
                    <h2>大模型接入预留区</h2>
                    <p>此段落包裹在一个预留了 ID 的 DIV 节点中。</p>
                    <p>后端会通过 <code>chat_chunk</code> 推送聊天文本，并通过 <code>dom_mutation</code> 派发局部文档修改。</p>
                </div>

                <div style="height: 260px;"><p class="text-gray-300 text-sm mt-10">（用来产生滚动条的占位空间）</p></div>
            `;

            const contentHTML = ref(initialContent);

            const nodeSupportsAttr = (node, attrName) => {
                return Boolean(node?.type?.spec?.attrs && Object.prototype.hasOwnProperty.call(node.type.spec.attrs, attrName));
            };

            const collectEditorIds = () => {
                const ids = new Set();
                if (!tiptapEditor) return ids;
                tiptapEditor.state.doc.descendants((node) => {
                    if (node.attrs?.id) ids.add(String(node.attrs.id));
                });
                return ids;
            };

            const createUniqueEditorId = (prefix, ids = collectEditorIds()) => {
                let id = '';
                do {
                    id = `${prefix}${String(makeId()).replace(/[^a-zA-Z0-9_-]/g, '-')}`;
                } while (ids.has(id));
                ids.add(id);
                return id;
            };

            const topLevelStructureSignature = () => {
                if (!tiptapEditor) return '';
                const parts = [];
                tiptapEditor.state.doc.forEach((node, _offset, index) => {
                    parts.push(`${index}:${node.type.name}:${node.attrs?.id || ''}:${node.childCount}`);
                });
                return parts.join('|');
            };

            const refreshTopLevelSignature = () => {
                lastTopLevelSignature = topLevelStructureSignature();
            };

            const getSelectionAnchorCandidate = () => {
                if (!tiptapEditor) return null;

                const { from, $from } = tiptapEditor.state.selection;
                let targetDepth = null;

                for (let depth = $from.depth; depth >= 1; depth -= 1) {
                    if ($from.node(depth)?.type?.name === 'listItem') {
                        targetDepth = depth;
                        break;
                    }
                }

                if (targetDepth === null) {
                    for (let depth = $from.depth; depth >= 1; depth -= 1) {
                        const node = $from.node(depth);
                        if (node?.isTextblock || node?.type?.name === 'blockquote' || node?.type?.name === 'customDiv') {
                            targetDepth = depth;
                            break;
                        }
                    }
                }

                if (targetDepth === null && $from.depth >= 1) targetDepth = 1;
                if (targetDepth === null) return null;

                const node = $from.node(targetDepth);
                const blockNode = $from.depth >= 1 ? $from.node(1) : node;
                let targetPos = from;
                try {
                    targetPos = $from.before(targetDepth);
                } catch {
                    targetPos = from;
                }

                return {
                    elementId: node?.attrs?.id || null,
                    blockId: blockNode?.attrs?.id || null,
                    pos: from,
                    targetPos,
                    nodeType: node?.type?.name || null
                };
            };

            const updateLastFocusAnchor = () => {
                const anchor = getSelectionAnchorCandidate();
                if (!anchor) return lastFocusAnchor;
                lastFocusAnchor = {
                    elementId: anchor.elementId,
                    blockId: anchor.blockId,
                    pos: anchor.pos
                };
                return lastFocusAnchor;
            };

            const ensureTopLevelBlockIds = () => {
                if (!tiptapEditor) return contentHTML.value;

                isMaintainingDocumentIds = true;
                try {
                    const ids = collectEditorIds();
                    const seenTopLevelIds = new Set();
                    let tr = tiptapEditor.state.tr;
                    tiptapEditor.state.doc.forEach((node, offset) => {
                        if (!node.isBlock || !nodeSupportsAttr(node, 'id')) return;
                        const currentId = node.attrs?.id ? String(node.attrs.id) : '';
                        const needsGeneratedId = !currentId
                            || currentId.startsWith(MOSS_TEMP_ANCHOR_PREFIX)
                            || (currentId.startsWith(MOSS_BLOCK_ID_PREFIX) && seenTopLevelIds.has(currentId));

                        if (!needsGeneratedId) {
                            seenTopLevelIds.add(currentId);
                            return;
                        }

                        const nextId = createUniqueEditorId(MOSS_BLOCK_ID_PREFIX, ids);
                        seenTopLevelIds.add(nextId);
                        const attrs = {
                            ...node.attrs,
                            id: nextId
                        };
                        if (nodeSupportsAttr(node, TEMP_ANCHOR_ATTR) && node.attrs?.[TEMP_ANCHOR_ATTR]) {
                            attrs[TEMP_ANCHOR_ATTR] = null;
                        }
                        tr = tr.setNodeMarkup(offset, undefined, {
                            ...attrs
                        });
                    });

                    if (tr.docChanged) tiptapEditor.view.dispatch(tr);
                    contentHTML.value = tiptapEditor.getHTML();
                    refreshTopLevelSignature();
                    updateLastFocusAnchor();
                    return contentHTML.value;
                } finally {
                    isMaintainingDocumentIds = false;
                }
            };

            const queueTopLevelIdMaintenance = () => {
                if (idMaintenanceQueued || isMaintainingDocumentIds) return;
                idMaintenanceQueued = true;
                window.requestAnimationFrame(() => {
                    idMaintenanceQueued = false;
                    ensureTopLevelBlockIds();
                });
            };

            const addTemporaryAnchor = (anchor) => {
                if (!tiptapEditor || !anchor) return null;
                const node = tiptapEditor.state.doc.nodeAt(anchor.targetPos);
                if (!node || node.attrs?.id || !nodeSupportsAttr(node, 'id') || !nodeSupportsAttr(node, TEMP_ANCHOR_ATTR)) {
                    return node?.attrs?.id || null;
                }

                const tempAnchorId = createUniqueEditorId(MOSS_TEMP_ANCHOR_PREFIX);
                const tr = tiptapEditor.state.tr.setNodeMarkup(anchor.targetPos, undefined, {
                    ...node.attrs,
                    id: tempAnchorId,
                    [TEMP_ANCHOR_ATTR]: 'true'
                });
                tiptapEditor.view.dispatch(tr);
                contentHTML.value = tiptapEditor.getHTML();
                refreshTopLevelSignature();
                return tempAnchorId;
            };

            const cleanupTemporaryAnchors = (tempAnchorId = null) => {
                if (!tiptapEditor) return;

                let tr = tiptapEditor.state.tr;
                tiptapEditor.state.doc.descendants((node, pos) => {
                    const id = node.attrs?.id || '';
                    const hasTempAttr = Boolean(node.attrs?.[TEMP_ANCHOR_ATTR]);
                    const isTrackedTemp = Boolean(tempAnchorId && id === tempAnchorId);
                    if (!hasTempAttr && !isTrackedTemp) return;

                    const attrs = { ...node.attrs };
                    if ((hasTempAttr || isTrackedTemp) && String(id).startsWith(MOSS_TEMP_ANCHOR_PREFIX) && nodeSupportsAttr(node, 'id')) {
                        attrs.id = null;
                    }
                    if (nodeSupportsAttr(node, TEMP_ANCHOR_ATTR)) {
                        attrs[TEMP_ANCHOR_ATTR] = null;
                    }
                    tr = tr.setNodeMarkup(pos, undefined, attrs);
                });

                if (!tr.docChanged) return;
                tiptapEditor.view.dispatch(tr);
                contentHTML.value = tiptapEditor.getHTML();
                refreshTopLevelSignature();
                updateLastFocusAnchor();
            };

            const getEditorDomElementById = (id) => {
                if (!id || !tiptapEditor?.view?.dom) return null;
                return findById(tiptapEditor.view.dom, id);
            };

            const getTopLevelBlockIdForElementId = (id) => {
                const target = getEditorDomElementById(id);
                if (!target) return null;

                let current = target;
                while (current.parentElement && current.parentElement !== tiptapEditor.view.dom) {
                    current = current.parentElement;
                }
                return current?.id || null;
            };

            const snapshotContainsId = (html, id) => {
                if (!id) return false;
                const parser = new DOMParser();
                const doc = parser.parseFromString(`<div data-moss-root>${html || ''}</div>`, 'text/html');
                return Boolean(findById(doc.body.firstElementChild, id));
            };

            const prepareAgentRequestAnchors = (explicitFocusId = null) => {
                const request = {
                    focusElementId: null,
                    focusBlockId: null,
                    canvasSnapshot: contentHTML.value,
                    tempAnchorId: null
                };
                if (!tiptapEditor) return request;

                cleanupTemporaryAnchors();
                ensureTopLevelBlockIds();

                let anchor = getSelectionAnchorCandidate();
                if (anchor) updateLastFocusAnchor();

                const explicitFocusExists = Boolean(explicitFocusId && getEditorDomElementById(explicitFocusId));
                if (!explicitFocusExists && anchor && !anchor.elementId) {
                    const tempAnchorId = addTemporaryAnchor(anchor);
                    if (tempAnchorId) {
                        if (String(tempAnchorId).startsWith(MOSS_TEMP_ANCHOR_PREFIX)) {
                            request.tempAnchorId = tempAnchorId;
                        }
                        anchor = getSelectionAnchorCandidate() || anchor;
                        updateLastFocusAnchor();
                    }
                }

                request.focusElementId = explicitFocusExists
                    ? explicitFocusId
                    : (anchor?.elementId || lastFocusAnchor?.elementId || null);
                request.focusBlockId = anchor?.blockId
                    || lastFocusAnchor?.blockId
                    || getTopLevelBlockIdForElementId(request.focusElementId)
                    || null;

                if (!request.focusElementId && request.focusBlockId) {
                    request.focusElementId = request.focusBlockId;
                }

                contentHTML.value = tiptapEditor.getHTML();
                request.canvasSnapshot = contentHTML.value;

                if (request.focusElementId && !snapshotContainsId(request.canvasSnapshot, request.focusElementId)) {
                    request.focusElementId = request.focusBlockId && snapshotContainsId(request.canvasSnapshot, request.focusBlockId)
                        ? request.focusBlockId
                        : null;
                }
                if (request.focusBlockId && !snapshotContainsId(request.canvasSnapshot, request.focusBlockId)) {
                    request.focusBlockId = getTopLevelBlockIdForElementId(request.focusElementId);
                }
                if (!request.focusElementId && request.focusBlockId) {
                    request.focusElementId = request.focusBlockId;
                }

                lastFocusAnchor = {
                    elementId: request.focusElementId,
                    blockId: request.focusBlockId,
                    pos: anchor?.pos || lastFocusAnchor?.pos || tiptapEditor.state.selection.from
                };

                return request;
            };

            const scrollToBottom = () => {
                const container = document.getElementById('chat-container');
                if (container) container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
            };

            const normalizeConversation = (conversation = {}) => ({
                conversation_id: conversation.conversation_id || '',
                note_id: conversation.note_id || currentNoteId.value,
                title: conversation.title || '',
                is_default: Boolean(conversation.is_default),
                created_at: conversation.created_at || '',
                updated_at: conversation.updated_at || ''
            });

            const conversationTitle = (conversation = {}) => {
                return conversation.title || (conversation.is_default ? 'Default conversation' : 'New discussion');
            };

            const isCurrentConversation = (conversation = {}) => {
                return conversation.conversation_id === currentConversationId.value;
            };

            const closeConversationTree = () => {
                showConversationTree.value = false;
            };

            const updateConversationTreePosition = () => {
                const preferredTreeWidth = 236;
                const minTreeWidth = 196;
                const pagePadding = 12;
                const panelRect = panelRef.value?.getBoundingClientRect?.();
                const buttonRect = libraryButtonRef.value?.getBoundingClientRect?.();
                const leftSpace = panelRect ? panelRect.left : window.innerWidth;
                const treeWidth = Math.min(
                    preferredTreeWidth,
                    Math.max(minTreeWidth, leftSpace - pagePadding * 2)
                );
                const centeredLeft = (leftSpace - treeWidth) / 2;
                const maxLeft = window.innerWidth - treeWidth - pagePadding;
                const left = Math.max(pagePadding, Math.min(centeredLeft, maxLeft));
                const fallbackTop = panelRect ? panelRect.top + 64 : 88;
                const top = buttonRect ? buttonRect.bottom + 14 : fallbackTop;
                conversationTreeStyle.value = {
                    left: `${left}px`,
                    top: `${top}px`,
                    width: `${treeWidth}px`,
                    zIndex: 1000
                };

            const toggleConversationTree = async () => {

                    await loadNoteConversations().catch(() => {});

                showConversationTree.value = true;

                updateConversationTreePosition();
            };

            const handleDocumentPointerDown = (event) => {
                if (!showConversationTree.value) return;
                const trigger = conversationTreeRef.value;
                const panel = conversationTreePanelRef.value;

            const createNote = async () => {
                const response = await fetch(apiUrl('/api/v1/notes'), { method: 'POST' });
                if (!response.ok) throw new Error(await response.text());
                const payload = await response.json();
                setCurrentNoteId(payload.note_id);
                setCurrentConversationId(payload.default_conversation_id);
                noteConversations.value = [

            const loadCurrentNote = async () => {
                if (isDraftNote.value || !currentNoteId.value) {

                    lastSavedSnapshot = '';
                    documentTitle.value = 'Untitled note';
                    noteConversations.value = [];
                    closeConversationTree();
                    messages.value = defaultMessages();
                    return;
                }

                const response = await fetch(apiUrl(`/api/v1/notes/${encodeURIComponent(currentNoteId.value)}`));
                if (!response.ok) throw new Error(await response.text());
                const note = await response.json();
                setCurrentNoteId(note.note_id);
                setCurrentConversationId(
                    initialConversationIdFromUrl || note.active_conversation_id || note.default_conversation_id
                );
                syncNoteUrl();
                currentNoteDisplayTitle.value = note.display_title || '';
                documentTitle.value = note.effective_title || note.display_title || note.title || 'Untitled note';
                contentHTML.value = note.canvas_snapshot || '<p></p>';
                lastSavedSnapshot = note.canvas_snapshot || '';
                await loadNoteConversations();
                await loadConversationMessages();
            };

            const loadNoteConversations = async () => {
                if (!currentNoteId.value) {
                    noteConversations.value = [];
                    return;
                }
                isLoadingConversations.value = true;
                conversationError.value = '';
                try {
                    const response = await fetch(apiUrl(`/api/v1/notes/${encodeURIComponent(currentNoteId.value)}/conversations`));
                    if (!response.ok) throw new Error(await response.text());
                    const payload = await response.json();
                    noteConversations.value = (payload.conversations || []).map(normalizeConversation);
                    if (!currentConversationId.value && payload.active_conversation_id) {
                        setCurrentConversationId(payload.active_conversation_id);
                        syncNoteUrl();
                    }
                } catch (error) {
                    conversationError.value = error.message || 'Failed to load discussions';
                } finally {
                    isLoadingConversations.value = false;
                }
            };

            const loadConversationMessages = async () => {
                if (!currentNoteId.value || !currentConversationId.value) {
                    messages.value = defaultMessages();
                    return;
                }
                const response = await fetch(apiUrl(`/api/v1/notes/${encodeURIComponent(currentNoteId.value)}/conversations/${encodeURIComponent(currentConversationId.value)}/messages`));
                if (!response.ok) throw new Error(await response.text());
                const payload = await response.json();
                const history = Array.isArray(payload.messages) ? payload.messages : [];
                messages.value = history.length ? history.map(normalizeMessage) : defaultMessages();
                await nextTick();
                scrollToBottom();
            };

            const createConversation = async () => {
                if (isCreatingConversation.value) return;
                isCreatingConversation.value = true;
                conversationError.value = '';
                try {
                    await flushAutosave();
                    if (!currentNoteId.value) {
                        await ensurePersistedNote(contentHTML.value, { allowBlank: true });
                    }
                    const response = await fetch(apiUrl(`/api/v1/notes/${encodeURIComponent(currentNoteId.value)}/conversations`), {
                        method: 'POST'
                    });
                    if (!response.ok) throw new Error(await response.text());
                    const conversation = normalizeConversation(await response.json());
                    setCurrentConversationId(conversation.conversation_id);
                    syncNoteUrl();
                    noteConversations.value = [
                        ...noteConversations.value.filter(item => item.conversation_id !== conversation.conversation_id),
                        conversation
                    ];
                    await loadConversationMessages();
                    await loadNoteConversations();
                    closeConversationTree();
                } catch (error) {
                    conversationError.value = error.message || 'Failed to create discussion';
                } finally {
                    isCreatingConversation.value = false;
                }
            };

            const switchConversation = async (conversation) => {
                const nextConversationId = conversation?.conversation_id || '';
                if (!nextConversationId || nextConversationId === currentConversationId.value) return;
                const previousConversationId = currentConversationId.value;
                conversationError.value = '';
                try {
                    await flushAutosave();
                    setCurrentConversationId(nextConversationId);
                    syncNoteUrl();
                    await loadConversationMessages();
                    await loadNoteConversations();
                    closeConversationTree();
                } catch (error) {
                    conversationError.value = error.message || 'Failed to switch discussion';
                    if (previousConversationId) {
                        setCurrentConversationId(previousConversationId);
                        syncNoteUrl();
                        await loadConversationMessages().catch(() => {});
                    }
                }
            };

            const isBlankSnapshot = (html) => {
                const holder = document.createElement('div');
                holder.innerHTML = html || '';
                const text = (holder.textContent || '').replace(/\u00a0/g, ' ').trim();
                if (text) return false;
                return !holder.querySelector('img, video, audio, iframe, table, hr, pre, code');
            };

            const ensurePersistedNote = async (snapshot = '', { allowBlank = false } = {}) => {
                if (currentNoteId.value && currentConversationId.value) return true;
                if (!allowBlank && isBlankSnapshot(snapshot)) return false;
                await createNote();
                return true;
            };

            const persistNoteSnapshot = async ({ immediate = false } = {}) => {
                if (!tiptapEditor) return;
                contentHTML.value = tiptapEditor.getHTML();
                if (!(await ensurePersistedNote(contentHTML.value))) return;
                if (contentHTML.value === lastSavedSnapshot) return;
                saveStatus.value = 'saving';
                const response = await fetch(apiUrl(`/api/v1/notes/${encodeURIComponent(currentNoteId.value)}/snapshot`), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ canvas_snapshot: contentHTML.value })
                });
                if (!response.ok) {
                    saveStatus.value = 'error';
                    throw new Error(await response.text());
                }
                const saved = await response.json();
                lastSavedSnapshot = contentHTML.value;
                documentTitle.value = currentNoteDisplayTitle.value || saved.title || documentTitle.value;
                saveStatus.value = 'saved';
            };

            const queueAutosave = () => {
                if (autosaveTimer) window.clearTimeout(autosaveTimer);
                autosaveTimer = window.setTimeout(() => {
                    autosaveTimer = null;
                    persistNoteSnapshot().catch(() => {});
                }, 1200);
            };

            const flushAutosave = async () => {
                if (autosaveTimer) {
                    window.clearTimeout(autosaveTimer);
                    autosaveTimer = null;
                }
                await persistNoteSnapshot({ immediate: true });
            };

            const saveContent = async () => {
                if (isSaving.value) return;
                isSaving.value = true;
                try {
                    await flushAutosave();
                } catch (error) {
                    messages.value.push(createNoticeMessage(`保存失败：${error.message}`));
                    await nextTick();
                    scrollToBottom();
                } finally {
                    setTimeout(() => { isSaving.value = false; }, 900);
                }
            };

            const triggerUpload = () => {
                if (isModifying.value) return;
                fileInputRef.value?.click();
            };

            const handleUpload = async (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('file', file);
                isModifying.value = true;
                try {
                    const response = await fetch(apiUrl('/api/document/upload'), {
                        method: 'POST',
                        body: formData
                    });
                    if (!response.ok) throw new Error(await response.text());
                    const result = await response.json();
                    contentHTML.value = result.htmlContent;
                    documentTitle.value = result.filename || file.name;
                    tiptapEditor.commands.setContent(contentHTML.value);
                    cleanupTemporaryAnchors();
                    ensureTopLevelBlockIds();
                    await persistNoteSnapshot({ immediate: true }).catch(() => {});
                    messages.value.push(createNoticeMessage(`已导入 ${documentTitle.value}。`));
                    await nextTick();
                    scrollToBottom();
                } catch (error) {
                    messages.value.push(createNoticeMessage(`导入失败：${error.message}`));
                } finally {
                    isModifying.value = false;
                    event.target.value = '';
                }
            };

            const exportDocument = async (format) => {
                try {
                    const response = await fetch(apiUrl('/api/document/export'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            format,
                            content: contentHTML.value,
                            filename: documentTitle.value.replace(/\.[^.]+$/, '') || 'moss-document'
                        })
                    });
                    if (!response.ok) throw new Error(await response.text());
                    const blob = await response.blob();
                    const disposition = response.headers.get('Content-Disposition') || '';
                    const match = disposition.match(/filename="([^"]+)"/);
                    downloadBlob(blob, match?.[1] || `moss-document.${format === 'markdown' ? 'md' : format}`);
                } catch (error) {
                    messages.value.push(createNoticeMessage(`导出失败：${error.message}`));
                    await nextTick();
                    scrollToBottom();
                }
            };

            const downloadBlob = (blob, filename) => {
                const url = URL.createObjectURL(blob);
                const anchor = document.createElement('a');
                anchor.href = url;
                anchor.download = filename;
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
                URL.revokeObjectURL(url);
            };

            const openAIPopup = () => {
                if (!tiptapEditor) return;
                if (!tiptapEditor.isFocused) tiptapEditor.commands.focus();

                const { from } = tiptapEditor.state.selection;
                const coords = tiptapEditor.view.coordsAtPos(from);
                const popupWidth = 320;

                aiPopupPos.value = {
                    top: Math.min(coords.bottom + 10, window.innerHeight - 64),
                    left: Math.max(16, Math.min(coords.left, window.innerWidth - popupWidth - 16))
                };

                showAIPopup.value = true;
                nextTick(() => {
                    if (aiPopupInputRef.value) aiPopupInputRef.value.focus();
                });
            };

            const closeAIPopup = () => {
                showAIPopup.value = false;
                aiPopupInput.value = '';
                if (tiptapEditor) tiptapEditor.commands.focus();
            };

            const submitAIPopup = () => {
                if (!aiPopupInput.value.trim()) return;
                const cmd = aiPopupInput.value.trim();
                updateLastFocusAnchor();
                closeAIPopup();
                inputText.value = cmd;
                sendMessage();
            };

            const getActiveElementId = () => {
                if (!tiptapEditor) return null;
                const { from, $from } = tiptapEditor.state.selection;
                for (let depth = $from.depth; depth >= 0; depth -= 1) {
                    const node = $from.node(depth);
                    if (node?.attrs?.id) return node.attrs.id;
                }

                let domNode = tiptapEditor.view.domAtPos(from).node;
                if (domNode.nodeType === window.Node.TEXT_NODE) domNode = domNode.parentElement;
                return domNode?.closest?.('[id]')?.id || null;
            };

            const scrollToTarget = (targetId) => {
                const container = document.getElementById('document-container');
                const target = document.getElementById(targetId);
                if (container && target) {
                    container.scrollTo({ top: target.offsetTop - 20, behavior: 'smooth' });
                }
            };

            const highlightTarget = (targetId) => {
                if (!tiptapEditor || !targetId) return;
                let targetPos = null;
                let originalClasses = '';

                tiptapEditor.state.doc.descendants((node, pos) => {
                    if (node.attrs.id === targetId) {
                        targetPos = pos;
                        originalClasses = node.attrs.class || '';
                    }
                });

                if (targetPos !== null) {
                    const node = tiptapEditor.state.doc.nodeAt(targetPos);
                    tiptapEditor.view.dispatch(
                        tiptapEditor.state.tr.setNodeMarkup(targetPos, undefined, {
                            ...node.attrs,
                            class: `${originalClasses} bg-blue-50`.trim()
                        })
                    );

                    setTimeout(() => {
                        const currentNode = tiptapEditor.state.doc.nodeAt(targetPos);
                        if (!currentNode) return;
                        tiptapEditor.view.dispatch(
                            tiptapEditor.state.tr.setNodeMarkup(targetPos, undefined, {
                                ...currentNode.attrs,
                                class: originalClasses
                            })
                        );
                    }, 2000);
                }
            };

            const applyDomMutation = async (mutation) => {
                const targetId = mutation.targetId || mutation.element_id || mutation.target_id;
                const actionType = mutation.action_type || mutation.type || 'replace';
                const newHTML = mutation.new_html || mutation.newHTML || '';
                if (!targetId || !tiptapEditor) return;

                const parser = new DOMParser();
                const doc = parser.parseFromString(`<div data-moss-root>${contentHTML.value}</div>`, 'text/html');
                const root = doc.body.firstElementChild;
                const target = findById(root, targetId);
                const targetWasTopLevel = target?.parentElement === root;

                if (!target && actionType !== 'insert') {
                    messages.value.push(createNoticeMessage(`未找到目标节点：${targetId}`));
                    return;
                }

                const holder = doc.createElement('div');
                holder.innerHTML = newHTML;
                const nodes = Array.from(holder.childNodes);
                const replacementElements = nodes.filter(node => node.nodeType === window.Node.ELEMENT_NODE);
                if (actionType === 'replace' && targetWasTopLevel && replacementElements.length && !replacementElements.some(node => node.id === targetId)) {
                    replacementElements[0].id = targetId;
                }

                if (actionType === 'delete') {
                    target.remove();
                } else if (actionType === 'append') {
                    target.append(...nodes);
                } else if (actionType === 'insert') {
                    if (target) {
                        target.after(...nodes);
                    } else {
                        root.append(...nodes);
                    }
                } else {
                    if (nodes.length) {
                        target.replaceWith(...nodes);
                    }
                }

                contentHTML.value = root.innerHTML;
                tiptapEditor.commands.setContent(contentHTML.value);
                ensureTopLevelBlockIds();
                await persistNoteSnapshot({ immediate: true }).catch(() => {});

                await nextTick();
                setTimeout(() => {
                    if (actionType !== 'delete') {
                        scrollToTarget(targetId);
                        highlightTarget(targetId);
                    }
                }, 80);
            };

            const findById = (root, id) => {
                const escaped = String(id).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
                return root.querySelector(`[id="${escaped}"]`);
            };

            const handleKeyDown = (e) => {
                const activeTag = document.activeElement?.tagName;
                const isInputFocused = activeTag === 'INPUT' || activeTag === 'TEXTAREA';

                if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
                    e.preventDefault();
                    saveContent();
                }
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'f' || e.key === 'F')) {
                    e.preventDefault();
                    toggleFullScreen();
                }

                if (isInputFocused && !showAIPopup.value) return;
                if (!tiptapEditor) return;

                if ((e.ctrlKey || e.metaKey) && e.key === '/') {
                    e.preventDefault();
                    openAIPopup();
                }

                if ((e.ctrlKey || e.metaKey) && e.key >= '1' && e.key <= '6') {
                    e.preventDefault();
                    tiptapEditor.commands.toggleHeading({ level: parseInt(e.key, 10) });
                }

                if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) {
                    e.preventDefault();
                    if (tiptapEditor.isActive('heading')) {
                        const currentLevel = tiptapEditor.getAttributes('heading').level;
                        if (currentLevel > 1) tiptapEditor.commands.setHeading({ level: currentLevel - 1 });
                    } else {
                        tiptapEditor.commands.setHeading({ level: 6 });
                    }
                }

                if ((e.ctrlKey || e.metaKey) && e.key === '-') {
                    e.preventDefault();
                    if (tiptapEditor.isActive('heading')) {
                        const currentLevel = tiptapEditor.getAttributes('heading').level;
                        if (currentLevel < 6) {
                            tiptapEditor.commands.setHeading({ level: currentLevel + 1 });
                        } else {
                            tiptapEditor.commands.setParagraph();
                        }
                    }
                }
            };

            const sendMessage = async (explicitFocusId = null) => {
                if (!inputText.value.trim() || isModifying.value) return;

                const currentInput = inputText.value.trim();
                let requestAnchors = null;
                messages.value.push({ role: 'user', content: currentInput });
                inputText.value = '';
                await nextTick();
                scrollToBottom();

                isThinking.value = true;
                isModifying.value = true;
                let aiIndex = -1;
                let noticeGenerated = false;
                let pendingTaskType = '';

                const ensureAiMessage = async () => {
                    if (aiIndex >= 0) return;
                    messages.value.push(createAnswerMessage('', pendingTaskType));
                    aiIndex = messages.value.length - 1;
                    isThinking.value = false;
                    await nextTick();
                };

                try {
                    if (!currentNoteId.value || !currentConversationId.value) {
                        const draftSnapshot = tiptapEditor ? tiptapEditor.getHTML() : contentHTML.value;
                        contentHTML.value = draftSnapshot;
                    }
                    requestAnchors = prepareAgentRequestAnchors(explicitFocusId);
                    await ensurePersistedNote(requestAnchors.canvasSnapshot, { allowBlank: true });
                    const response = await fetch(apiUrl('/api/v1/chat-stream'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            session_id: sessionId,
                            note_id: currentNoteId.value,
                            conversation_id: currentConversationId.value,
                            user_input: currentInput,
                            focus_element_id: requestAnchors.focusElementId,
                            focus_block_id: requestAnchors.focusBlockId,
                            canvas_snapshot: requestAnchors.canvasSnapshot
                        })
                    });

                    if (!response.ok || !response.body) {
                        throw new Error(await response.text());
                    }

                    await readEventStream(response, async ({ event, data }) => {
                        if (event === 'conversation' && data.conversation_id) {
                            setCurrentConversationId(data.conversation_id);
                        }

                        if (event === 'node_end' && data.node === 'intent') {
                            const taskType = normalizeTaskType(data.output?.task_type);
                            if (taskType) {
                                pendingTaskType = taskType;
                                if (aiIndex >= 0) {
                                    messages.value[aiIndex].taskType = taskType;
                                }
                            }
                        }

                        if (event === 'chat_chunk') {
                            await ensureAiMessage();
                            messages.value[aiIndex].content += data.content || '';
                            await nextTick();
                            scrollToBottom();
                        }

                        if (event === 'dom_mutation') {
                            await applyDomMutation(data);
                        }

                        if (event === 'error') {
                            const message = data.message || '服务端处理失败';
                            if (aiIndex >= 0) {
                                messages.value[aiIndex].content += `\n${message}`;
                            } else {
                                messages.value.push(createNoticeMessage(message));
                                noticeGenerated = true;
                            }
                        }
                    });

                    if (aiIndex < 0 && !noticeGenerated) {
                        messages.value.push(createNoticeMessage('处理完成。'));
                    }
                } catch (error) {
                    if (aiIndex < 0) {
                        messages.value.push(createNoticeMessage(`连接失败：${error.message}`));
                    } else {
                        messages.value[aiIndex].content = `连接失败：${error.message}`;
                    }
                } finally {
                    if (requestAnchors?.tempAnchorId) {
                        cleanupTemporaryAnchors(requestAnchors.tempAnchorId);
                        ensureTopLevelBlockIds();
                    }
                    isThinking.value = false;
                    isModifying.value = false;
                    if (currentNoteId.value) {
                        await loadNoteConversations().catch(() => {});
                    }
                    await nextTick();
                    scrollToBottom();
                }
            };

            const readEventStream = async (response, onEvent) => {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    let boundary = buffer.indexOf('\n\n');
                    while (boundary !== -1) {
                        const frame = buffer.slice(0, boundary);
                        buffer = buffer.slice(boundary + 2);
                        const parsed = parseSseFrame(frame);
                        if (parsed) await onEvent(parsed);
                        boundary = buffer.indexOf('\n\n');
                    }
                }
            };

            const parseSseFrame = (frame) => {
                let event = 'message';
                const dataLines = [];
                for (const line of frame.split(/\r?\n/)) {
                    if (line.startsWith('event:')) event = line.slice(6).trim();
                    if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart());
                }
                if (!dataLines.length) return { event, data: {} };
                try {
                    return { event, data: JSON.parse(dataLines.join('\n')) };
                } catch {
                    return { event, data: { content: dataLines.join('\n') } };
                }
            };

            const toggleFullScreen = () => {
                isFullScreen.value = !isFullScreen.value;
            };

            const startDragging = (e) => {
                if (isFullScreen.value) return;

                e.preventDefault();
                window.getSelection?.().removeAllRanges();

                isDragging.value = true;
                startY.value = e.clientY;
                startHeight.value = panelHeight.value;
                document.addEventListener('mousemove', handleDragging);
                document.addEventListener('mouseup', stopDragging);
            };

            const handleDragging = (e) => {
                if (!isDragging.value) return;
                let newHeight = startHeight.value + (e.clientY - startY.value);
                const minHeight = 240;
                const maxHeight = window.innerHeight - 150;
                if (newHeight < minHeight) newHeight = minHeight;
                if (newHeight > maxHeight) newHeight = maxHeight;
                panelHeight.value = newHeight;
                if (showConversationTree.value) updateConversationTreePosition();
            };

            const stopDragging = () => {
                isDragging.value = false;
                document.removeEventListener('mousemove', handleDragging);
                document.removeEventListener('mouseup', stopDragging);
            };

            const handleResize = () => {
                const maxHeight = window.innerHeight - 150;
                if (panelHeight.value > maxHeight) panelHeight.value = maxHeight;
                if (showConversationTree.value) updateConversationTreePosition();
            };

            const openLibrary = async () => {
                try {
                    await flushAutosave();
                } catch {}
                window.location.href = '/library';
            };

            onMounted(async () => {
                try {
                    try {
                        await loadCurrentNote();
                    } catch (error) {
                        noteLoadError.value = error.message || '加载笔记失败';
                        messages.value.push(createNoticeMessage(`加载笔记失败：${noteLoadError.value}`));
                        contentHTML.value = '<p></p>';
                    }

                    tiptapEditor = new Editor({
                        element: editorContainer.value,
                        extensions: [
                            StarterKit,
                            CustomDiv,
                            GlobalAttributes
                        ],
                        content: contentHTML.value,
                        editorProps: {
                            attributes: {
                                spellcheck: 'false',
                            },
                            handlePaste: () => {
                                window.setTimeout(() => {
                                    ensureTopLevelBlockIds();
                                    updateLastFocusAnchor();
                                }, 0);
                                return false;
                            }
                        },
                        onSelectionUpdate: () => {
                            updateLastFocusAnchor();
                        },
                        onUpdate: ({ editor }) => {
                            contentHTML.value = editor.getHTML();
                            if (!isMaintainingDocumentIds) queueAutosave();
                            if (isMaintainingDocumentIds) return;
                            const signature = topLevelStructureSignature();
                            if (signature !== lastTopLevelSignature) {
                                lastTopLevelSignature = signature;
                                queueTopLevelIdMaintenance();
                            }
                        }
                    });
                    cleanupTemporaryAnchors();
                    ensureTopLevelBlockIds();
                    refreshTopLevelSignature();

                    window.addEventListener('keydown', handleKeyDown);
                    window.addEventListener('resize', handleResize);
                    document.addEventListener('pointerdown', handleDocumentPointerDown);
                } finally {
                    hideInitialLoading();
                }
            });

            onUnmounted(() => {
                window.removeEventListener('keydown', handleKeyDown);
                window.removeEventListener('resize', handleResize);
                document.removeEventListener('pointerdown', handleDocumentPointerDown);
                document.removeEventListener('mousemove', handleDragging);
                document.removeEventListener('mouseup', stopDragging);
                if (autosaveTimer) window.clearTimeout(autosaveTimer);
                tiptapEditor?.destroy();
            });

            return {
                inputText,
                messages,
                contentHTML,
                isModifying,
                isThinking,
                panelHeight,
                sendMessage,
                chatPaddingTop,
                isDragging,
                startDragging,
                isFullScreen,
                toggleFullScreen,
                editorContainer,
                fileInputRef,
                libraryButtonRef,
                panelRef,
                isSaving,
                saveContent,
                triggerUpload,
                handleUpload,
                exportDocument,
                showAIPopup,
                aiPopupPos,
                aiPopupInput,
                aiPopupInputRef,
                submitAIPopup,
                closeAIPopup,
                documentTitle,
                currentNoteId,
                setCurrentNoteId,
                currentConversationId,
                setCurrentConversationId,
                noteConversations,
                isLoadingConversations,
                isCreatingConversation,
                conversationError,
                showConversationTree,
                conversationTreeRef,
                conversationTreePanelRef,
                conversationTreeStyle,
                toggleConversationTree,
                createConversation,
                switchConversation,
                conversationTitle,
                isCurrentConversation,
                saveStatus,
                noteLoadError,
                openLibrary,
                renderMarkdown,
                isAnswerMessage,
                getTaskTypeLabel,
                copyMessage,
                copiedMessageIndex
            };
        }
    }).mount('#app');
</script>
</body>
</html>
